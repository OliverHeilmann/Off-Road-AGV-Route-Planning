# A custom material using the SandyGround parameters as baseline. Texture created by Oliver Heilmann

PROTO TerrainMatte [
  field SFColor colorOverride    1 1 1  # Defines the color to be multiplied with the texture color.
  field SFNode  textureTransform NULL   # Defines an optional 2d texture transform.
  field SFFloat IBLStrength      1      # Defines the strength of ambient lighting from the Background node.
]
{
  PBRAppearance {
    baseColor IS colorOverride
    baseColorMap ImageTexture {
      url [
        "//Users/Oliver/Documents/CODING/Python_Prgms/WeBots_ElevationMap/webots_moose/protos/textures/TerrainFeaturesScaled.png"
      ]
      filtering 0
    }
    roughnessMap ImageTexture {
      url [
        "https://raw.githubusercontent.com/cyberbotics/webots/R2022a/projects/appearances/protos/textures/matte_car_paint/matte_car_paint_roughness.jpg"
      ]
      filtering 5
    }
    metalness 0
    normalMapFactor 0.5
    IBLStrength IS IBLStrength
    textureTransform IS textureTransform
  }
}